[project]
name = "3D computer vision"
version = "0.1.0"
description = "Using a drone dataset to practice 2D and 3D computer vision techniques."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "open3d>=0.19.0",
    "pillow>=12.2.0",
    "pymeshlab>=2025.7.post1",
]

[tool.pyright]
typeCheckingMode = "off"